<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majlis Penganugerahan Imigresen Sarawak 2026</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* Warna latar belakang gelap */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #flipbook-container {
            width: 95vw;
            height: 90vh;
            max-width: 1200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .page {
            background-color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #loading {
            color: white;
            font-size: 1.2rem;
            position: absolute;
            z-index: 10;
        }
    </style>

    <!-- Muat turun pustaka PDF.js dan StPageFlip dari CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

    <div id="loading">Memuatkan buku program...</div>
    <div id="flipbook-container"></div>

    <script>
        // 1. Tetapkan lokasi worker PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // 2. Nama fail PDF (pastikan sama dengan fail anda)
        const pdfUrl = 'majlis.pdf'; 

        // 3. Muatkan fail PDF
        pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {
            const totalPages = pdf.numPages;
            const container = document.getElementById('flipbook-container');
            
            document.getElementById('loading').style.display = 'none'; // Sembunyikan loading

            // 4. Sediakan StPageFlip
            const pageFlip = new St.PageFlip(container, {
                width: 550, // Lebar asas
                height: 780, // Tinggi asas (nisbah A4)
                size: 'stretch',
                minWidth: 315,
                maxWidth: 1000,
                minHeight: 420,
                maxHeight: 1350,
                drawShadow: true, // Efek bayang 3D
                showCover: true,  // Jadikan muka depan tebal
                usePortrait: true,
                mobileScrollSupport: false
            });

            // 5. Proses setiap halaman PDF menjadi imej HTML
            let pagesPromises = [];
            for (let i = 1; i <= totalPages; i++) {
                const pageNum = i;
                const promise = pdf.getPage(pageNum).then(function(page) {
                    const viewport = page.getViewport({ scale: 1.5 }); // Kualiti resolusi
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };

                    return page.render(renderContext).promise.then(() => {
                        const pageDiv = document.createElement('div');
                        pageDiv.classList.add('page');
                        pageDiv.appendChild(canvas);
                        return pageDiv;
                    });
                });
                pagesPromises.push(promise);
            }

            // 6. Siapkan halaman ke dalam Flipbook selepas semua dimuatkan
            Promise.all(pagesPromises).then((pagesHtml) => {
                pageFlip.loadFromHTML(pagesHtml);
            });

        }).catch(function(error) {
            console.error('Ralat memuatkan PDF:', error);
            document.getElementById('loading').innerHTML = 
                '<p style="color:red;">Gagal memuatkan PDF.<br>Pastikan fail bernama <b>majlis.pdf</b> berada dalam folder yang sama.</p>';
        });
    </script>
</body>
</html>
