<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majlis Penganugerahan Imigresen Sarawak 2026</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #flipbook-container {
            width: 95vw;
            height: 90vh;
            max-width: 1200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .page {
            background-color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #loading {
            color: white;
            font-size: 1.2rem;
            position: absolute;
            z-index: 10;
            text-align: center;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

    <div id="loading">Menyemak dan memuatkan halaman...</div>
    <div id="flipbook-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const pdfUrl = 'majlis.pdf'; 
        const BLANK_PIXEL_THRESHOLD = 0.005; // 0.5% - Sesuaikan jika perlu (0.001 = 0.1%, 0.01 = 1%)

        pdfjsLib.getDocument(pdfUrl).promise.then(async function(pdf) {
            const totalPages = pdf.numPages;
            const container = document.getElementById('flipbook-container');
            const loadingEl = document.getElementById('loading');

            const pageFlip = new St.PageFlip(container, {
                width: 550,
                height: 780,
                size: 'stretch',
                minWidth: 315,
                maxWidth: 1000,
                minHeight: 420,
                maxHeight: 1350,
                drawShadow: true,
                showCover: true,
                usePortrait: true,
                mobileScrollSupport: false
            });

            let pagesHtml = [];

            // Fungsi untuk menyemak sama ada halaman kosong
            async function isPageBlank(page) {
                // Render pada skala rendah (0.2) untuk semakan pantas
                const viewport = page.getViewport({ scale: 0.2 }); 
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({ canvasContext: context, viewport: viewport }).promise;

                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                let nonWhitePixels = 0;

                for (let i = 0; i < data.length; i += 4) {
                    // Semak jika piksel bukan putih tulen (RGB < 250 dianggap ada kandungan)
                    if (data[i] < 250 || data[i+1] < 250 || data[i+2] < 250) {
                        nonWhitePixels++;
                    }
                }

                const totalPixels = data.length / 4;
                const nonWhiteRatio = nonWhitePixels / totalPixels;
                
                // Jika kurang daripada threshold, anggap kosong
                return nonWhiteRatio < BLANK_PIXEL_THRESHOLD;
            }

            // Proses setiap halaman
            for (let i = 1; i <= totalPages; i++) {
                loadingEl.innerText = `Menyemak halaman ${i} daripada ${totalPages}...`;
                
                const page = await pdf.getPage(i);

                // 1. Semak jika kosong
                const blank = await isPageBlank(page);
                if (blank) {
                    console.log(`Halaman ${i} adalah kosong dan akan diabaikan.`);
                    continue; // Langkau halaman ini
                }

                // 2. Jika tidak kosong, render pada resolusi penuh untuk paparan
                const viewport = page.getViewport({ scale: 1.5 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({ canvasContext: context, viewport: viewport }).promise;

                const pageDiv = document.createElement('div');
                pageDiv.classList.add('page');
                pageDiv.appendChild(canvas);
                pagesHtml.push(pageDiv);
            }

            // 3. Muatkan halaman yang lulus semakan ke dalam flipbook
            loadingEl.style.display = 'none';
            pageFlip.loadFromHTML(pagesHtml);

        }).catch(function(error) {
            console.error('Ralat memuatkan PDF:', error);
            document.getElementById('loading').innerHTML = 
                '<p style="color:red;">Gagal memuatkan PDF.<br>Pastikan fail bernama <b>majlis.pdf</b> berada dalam folder yang sama.</p>';
        });
    </script>
</body>
</html>
